<!DOCTYPE html>
<html lang="sv" data-base="./">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <script>
    /* Set <html lang> from the saved language before first paint, so browsers detect the right language */
    try {
      var l = localStorage.getItem("portfolio-locale");
      if (l === "en" || l === "sv") document.documentElement.lang = l;
    } catch (e) {}
  </script>

  <meta name="theme-color" content="#e9e9e9" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Projects — Agnes Sandberg, mobile app developer.">
  <title>Projects | Agnes Sandberg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Istok+Web:wght@400&family=Google+Sans+Flex:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
