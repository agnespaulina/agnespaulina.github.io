<!DOCTYPE html>
<html lang="sv" data-base="./">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2f1f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#f2f1f0" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="CV — Agnes Sandberg.">
  <title>CV | Agnes Sandberg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Istok+Web:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="javascript/main.js"></script>
</head>
<body data-page="cv" class="site-theme-figma">
  <a class="visually-hidden" href="#main">Skip to content</a>
  <div data-component="site-header"></div>

  <main id="main" class="page-main">
    <div class="page-wrap cv-layout">
      <section class="cv-areas" aria-labelledby="cv-areas-heading">
        <h2 class="cv-section__heading section-label" id="cv-areas-heading" data-cv-areas-heading>Mina kompetensområden</h2>
        <div class="cv-areas__grid" data-cv-areas-grid></div>
      </section>

      <section class="cv-resume" aria-labelledby="cv-resume-heading">
        <div class="cv-resume__copy">
          <h2 class="cv-section__heading section-label" id="cv-resume-heading" data-cv-resume-heading>Mitt CV</h2>
          <p class="cv-resume__intro" data-cv-resume-intro></p>
        </div>
        <button type="button" class="cv-resume__thumbnail" data-cv-thumbnail>
          <span class="cv-resume__thumbnail-frame" data-cv-thumbnail-mount></span>
        </button>
        <a class="btn btn--download cv-resume__download" data-cv-download href="#" download>
          <img class="btn--download__icon" data-cv-download-icon src="assets/icons/icon_download.svg" alt="" width="24" height="24" decoding="async">
          <span class="btn--download__label" data-cv-download-label>Ladda ner CV</span>
        </a>
      </section>
    </div>
  </main>

  <div class="cv-overlay" data-cv-overlay hidden aria-hidden="true">
    <div class="cv-overlay__backdrop" data-cv-overlay-backdrop></div>
    <div
      class="cv-overlay__dialog"
      data-cv-overlay-dialog
      role="dialog"
      aria-modal="true"
      aria-labelledby="cv-overlay-title"
    >
      <header class="cv-overlay__header">
        <h2 class="cv-overlay__title" id="cv-overlay-title" data-cv-overlay-title>Mitt CV</h2>
        <div class="cv-overlay__toolbar">
          <a class="btn btn--download cv-overlay__download" data-cv-overlay-download href="#" download>Ladda ner CV</a>
          <button type="button" class="cv-overlay__close" data-cv-overlay-close aria-label="Stäng">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
      </header>
      <div class="cv-overlay__body">
        <div class="cv-overlay__viewer cv-preview__viewer" data-cv-overlay-viewer></div>
        <p class="cv-overlay__fallback">
          <a data-cv-overlay-open-tab href="#" target="_blank" rel="noopener noreferrer">Öppna PDF i ny flik</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
